name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Sync dependencies (frozen lockfile)
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Import boundary contracts (lint-imports)
        run: uv run lint-imports

      - name: Test suite
        run: uv run pytest -q

      - name: Miniature end-to-end (ci profile, via the DVC pipeline)
        run: just reproduce profile="ci"

      - name: Golden reproducibility suite
        run: uv run pytest tests/golden -q -m slow

      # HIGH-10: the RSS gate cannot vanish by permanent skip. Plans 01-08, 01-09 and 01-10
      # each assert peak process RSS, which is the only instrument that can observe the Arrow
      # and DuckDB half of ENG-08's budget, and each is specified to skip with a stated reason
      # where the platform provides no `getrusage` reading -- the case on the Windows
      # development machine this phase was built on. D-16 makes this Linux runner the
      # enforcing platform, so a skip here must fail the job rather than pass it silently.
      # With NEXTMOVE_RUN_DEFAULT_BUDGET=1 set, the only skip condition remaining in any of
      # the three budget suites is peak-RSS unavailability (see tests/integration/
      # test_simulation_budget.py, test_ingest_budget.py, test_features_budget.py) -- their
      # other gating skip is bypassed by the env var -- so any reported skip here is
      # necessarily that one.
      - name: Memory budget suite (demo profile; fails the job on any skipped peak-RSS assertion)
        run: |
          set -o pipefail
          NEXTMOVE_RUN_DEFAULT_BUDGET=1 NEXTMOVE_BUDGET_PROFILE=demo uv run pytest \
            tests/integration/test_simulation_budget.py \
            tests/integration/test_ingest_budget.py \
            tests/integration/test_features_budget.py \
            -m slow -rs -q | tee budget-output.txt
          if grep -Eq '[1-9][0-9]* skipped' budget-output.txt; then
            echo "::error::A peak-RSS assertion was skipped on this runner. ENG-08's memory bound must be measured on Linux CI (D-16), not merely declared." >&2
            exit 1
          fi

      # -----------------------------------------------------------------
      # Ownership notes for future readers of this workflow.
      #
      # Static type checking (mypy) is deliberately absent from this
      # workflow in Phase 1. This is a recorded decision, not an
      # oversight: the typed plugin registries a type checker would
      # protect (ENG-02) do not exist until Phase 2, and D-16 forbids a
      # non-blocking CI step, so introducing mypy before ENG-02 lands
      # would be a hard gate failing for reasons unrelated to this
      # phase's goals. Phase 2 / ENG-02 owns adding a `mypy` step here.
      # -----------------------------------------------------------------
