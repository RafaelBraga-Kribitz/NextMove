name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Sync dependencies (frozen lockfile)
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Import boundary contracts (lint-imports)
        run: uv run lint-imports

      # Gap closure G-01-2: this step now excludes `peak_rss` so each of the six peak-RSS
      # assertions runs exactly once per CI run (in the dedicated peak-RSS step below) rather
      # than once here (unmeasured -- this step prints no budget numbers and enforces no gate)
      # and once there. The honest limit of this change: the session-scoped in-process
      # `demo_run_result` fixture (and its ingest/features derivatives) is still built in this
      # step for the heap/tracemalloc assertions that also depend on it, so what is
      # de-duplicated is the three RSS *subprocess* runs, not the demo run itself.
      - name: Test suite
        run: uv run pytest -q -m "not peak_rss"

      - name: Miniature end-to-end (ci profile, via the DVC pipeline)
        run: just reproduce profile="ci"

      - name: Golden reproducibility suite
        run: uv run pytest tests/golden -q -m slow

      # HIGH-10 / gap closure G-01-2: the RSS gate cannot vanish by permanent skip, and it
      # cannot silently select nothing either -- both were true of this step's previous `-m
      # slow` filter (.planning/debug/ci-budget-marker-mismatch.md). Selection is now by the
      # dedicated `peak_rss` marker, which names exactly the six assertions across
      # test_simulation_budget.py, test_ingest_budget.py and test_features_budget.py that read
      # a peak process RSS measurement via `resource.getrusage` -- the only instrument that can
      # observe the Arrow and DuckDB half of ENG-08's budget. Each of those six has exactly one
      # skip condition: no POSIX `resource` module (tests/integration/conftest.py), the case on
      # the Windows development machine this phase was built on. D-16 makes this Linux runner
      # the enforcing platform, so a skip here must fail the job rather than pass it silently.
      # `NEXTMOVE_RUN_DEFAULT_BUDGET` / `NEXTMOVE_BUDGET_PROFILE` are dropped from this
      # invocation: no test selected by `-m peak_rss` reads either env var, and the six
      # selected tests take their budgets from `_PROFILE_BUDGETS["demo"]` directly rather than
      # from an overridable profile. The expected-count gate exists because a marker filter
      # that silently selects nothing is exactly what this step shipped with for five plans
      # (01-06/01-08/01-09/01-10/01-11) -- `-m slow` collected one unrelated test instead of
      # the intended set, and that one test's wall-clock assertion masked the gap further.
      #
      # This step deliberately omits an explicit `-q` on the pytest invocation below: this
      # repo's `pyproject.toml` already sets `addopts = "-q --strict-markers"`, and pytest 9.1
      # suppresses its own final summary line (the "6 passed" / "N skipped" text both grep
      # gates below depend on) once verbosity is lowered a second time by a second `-q`. A
      # single, addopts-supplied `-q` is the quietest level that still prints that line.
      - name: Peak-RSS suite (fails the job on any skipped or missing peak-RSS assertion)
        run: |
          set -o pipefail
          status=0
          uv run pytest \
            tests/integration/test_simulation_budget.py \
            tests/integration/test_ingest_budget.py \
            tests/integration/test_features_budget.py \
            -m peak_rss -rs | tee budget-output.txt || status=$?
          if grep -Eq '[1-9][0-9]* skipped' budget-output.txt; then
            echo "::error::A peak-RSS assertion was skipped on this runner. ENG-08's memory bound must be measured on Linux CI (D-16), not merely declared." >&2
            exit 1
          fi
          if ! grep -Eq '(^| )6 passed' budget-output.txt; then
            echo "::error::Expected exactly 6 peak-RSS assertions to run and pass. If the marked set legitimately changed, update both this count and EXPECTED_PEAK_RSS_TESTS in tests/unit/test_ci_workflow_structure.py." >&2
            exit 1
          fi
          exit $status

      # -----------------------------------------------------------------
      # Ownership notes for future readers of this workflow.
      #
      # Static type checking (mypy) is deliberately absent from this
      # workflow in Phase 1. This is a recorded decision, not an
      # oversight: the typed plugin registries a type checker would
      # protect (ENG-02) do not exist until Phase 2, and D-16 forbids a
      # non-blocking CI step, so introducing mypy before ENG-02 lands
      # would be a hard gate failing for reasons unrelated to this
      # phase's goals. Phase 2 / ENG-02 owns adding a `mypy` step here.
      # -----------------------------------------------------------------
