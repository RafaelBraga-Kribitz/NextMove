[project]
name = "nextmove"
version = "0.1.0"
description = "Behavioral Decision Engine for E-commerce Personalization"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13,<3",
    "pyarrow>=25,<26",
    "duckdb>=1.5,<2",
    "pandera>=0.32,<1",
    "pyyaml",
    "numpy>=2.5,<3",
    "pandas>=2.3,<3",
]

[dependency-groups]
dev = [
    "dvc>=3.67",
    "mlflow>=3.14",
    "import-linter>=2.13",
    "ruff>=0.16",
    "pytest",
    "pytest-cov",
    "hypothesis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nextmove"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff formats fenced Python code blocks inside Markdown by default; .planning/ and the
# root planning docs are project documentation, not source under this repo's lint scope.
extend-exclude = [".planning", "docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow",
    "golden: marks golden-file determinism tests",
]

[tool.coverage.run]
source = ["src/nextmove"]
branch = true

[tool.importlinter]
root_packages = ["nextmove"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "simulator internals must never reach the learned/decision layers"
type = "forbidden"
source_modules = [
    "nextmove.models",
    "nextmove.decisions",
    "nextmove.policies",
    "nextmove.features",
]
forbidden_modules = ["nextmove.simulator"]

# Storage sits behind a thin repository layer (ENG-01): every package except
# nextmove.storage is forbidden from importing pyarrow or duckdb directly. A
# consumer package that must name an Arrow type in an annotation imports the
# public `Table` alias re-exported from `nextmove.storage` (plan 01-06) instead
# of importing pyarrow itself — that is the sanctioned route, and no exemption
# or TYPE_CHECKING allowance is configured on this contract.
[[tool.importlinter.contracts]]
name = "only nextmove.storage may touch the parquet/duckdb i/o surface"
type = "forbidden"
source_modules = [
    "nextmove.simulator",
    "nextmove.ingest",
    "nextmove.features",
    "nextmove.segmentation",
    "nextmove.models",
    "nextmove.rules",
    "nextmove.decisions",
    "nextmove.policies",
    "nextmove.explain",
    "nextmove.evaluate",
    "nextmove.api",
    "nextmove.config",
]
forbidden_modules = ["pyarrow", "duckdb"]
