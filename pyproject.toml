[project]
name = "nextmove"
version = "0.1.0"
description = "Behavioral Decision Engine for E-commerce Personalization"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13,<3",
    "pyarrow>=25,<26",
    "duckdb>=1.5,<2",
    "pandera>=0.32,<1",
    "pyyaml",
    "numpy>=2.5,<3",
    "pandas>=2.3,<3",
]

[dependency-groups]
dev = [
    "dvc>=3.67",
    "mlflow>=3.14",
    "import-linter>=2.13",
    "ruff>=0.16",
    "pytest",
    "pytest-cov",
    "hypothesis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nextmove"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow",
    "golden: marks golden-file determinism tests",
]

[tool.coverage.run]
source = ["src/nextmove"]
branch = true
