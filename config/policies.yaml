# Policy settings. `baselines` configure the comparison policies of AC-10; every policy, the
# baselines included, chooses only among candidates that survived the hard constraints.
policies:
  baselines:
    top_seller_candidate: recommend__top_seller
    # Hand-written CRM playbook ("rules-only"), the strongest non-learned baseline:
    #   1. items in cart and a history of buying on discount -> small discount
    #   2. otherwise, an engaged browser -> affinity recommendation
    #   3. otherwise, a lapsing customer -> win-back email in their usual window
    #   4. otherwise -> do nothing
    rules_only:
      cart_units_min: 1
      price_sensitivity_proxy_min: 0.25
      discount_candidate: discount_low__1000bps
      engaged_sessions_min: 4
      engaged_candidate: recommend__affinity
      lapsed_recency_days_min: 60
      lapsed_candidate: email_delayed
