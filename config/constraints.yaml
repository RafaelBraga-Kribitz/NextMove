# Declarative constraint set (A4). `kind` selects a registered Constraint implementation
# (nextmove.rules registry); `mode` makes it hard (removes candidates before ranking) or soft
# (adds a penalty in cents during ranking). Precedence resolves conflicts:
# compliance > inventory > campaign > preference.
constraints:
  rules:
    - name: discount_ceiling
      kind: discount_ceiling
      mode: hard
      precedence: compliance
      params: {max_discount_bps: 2000}
    - name: margin_floor
      kind: margin_floor
      mode: hard
      precedence: compliance
      params: {min_margin_rate_after_discount: 0.20}
    - name: inventory_scarcity_gate
      kind: inventory_scarcity
      mode: hard
      precedence: inventory
      params: {archetypes: [discount_low, discount_high, bundle]}
    - name: frequency_cap
      kind: frequency_cap
      mode: hard
      precedence: campaign
      params: {max_contacts: 2, window_days: 7}
    - name: fatigue_penalty
      kind: fatigue_penalty
      mode: soft
      precedence: preference
      params: {penalty_cents_per_recent_contact: 15, window_days: 14}
