# Response models (B2, ADR-005/ADR-006/ADR-012). Two model families compete on the same
# randomized-experiment data; each is a bootstrap ensemble (resampled by customer) whose
# spread gives the uncertainty intervals, Platt-calibrated (a monotone, smooth map that keeps
# small uplift differences intact) on the
# validation window. Only attributable models are admitted to the decision path (ADR-005):
# logistic attributions are exact coefficient contributions, LightGBM's are TreeSHAP values.
models:
  ensemble_size: 8
  logistic:
    C: 0.1
    max_iter: 3000
  gbm:
    n_estimators: 250
    learning_rate: 0.05
    num_leaves: 15
    min_child_samples: 300
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 5.0
  calibration:
    # AC-5 gate: expected calibration error on the out-of-time test window must not exceed
    # this bound, or the train stage fails.
    max_ece: 0.01
    reliability_bins: 10
  # How many signed feature contributions a decision trace carries.
  attribution_top_k: 5
